name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Ensure android platform
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.vravpass --project-name vrav_pass --platforms=android
          fi

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/*.apk
          body: |
            ## Vrav Pass ${{ github.ref_name }}

            Offline-first password manager. **Beta** — read SECURITY.md and README before use.

            ### Install
            Download an APK for your ABI (`arm64-v8a` on most phones), enable install from unknown sources if needed.

            Master password cannot be recovered if forgotten.
